<style>

    .examples-strip { display: flex; flex-wrap: wrap; gap: 3px; }
    .ex-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 3px;
                border: 1px solid #444; cursor: pointer; }

    /* full-image overlay */

<body>

<div id="overlay">
    <span id="overlay-close">&#x2715;</span>
    <img id="overlay-img" src="" alt="">
</div>

<div id="toolbar">
    <h1>Simple Annotator{% if user %} — {{ user }}{% endif %}</h1>
    <div id="instruction">For each row: verify or edit the labels, then click <strong>Approve</strong>. Save is enabled once all rows are approved.</div>
    <input id="filter-input" type="text" placeholder="Filter by predicted label…">
    <label style="color:#aaa;font-size:0.85em">Sort:
        <select id="sort-select" style="background:#333;color:#ddd;border:1px solid #555;border-radius:4px;padding:3px 6px">
            <option value="fre_strat" selected>Deviating cases</option>
            <option value="nn_underrepresented">Rare classes</option>
            <option value="calibrated_uncertainty">Most certain</option>
            <option value="partial_first">Partial labeled first</option>
        </select>
    </label>
    <label style="color:#aaa;font-size:0.85em">Show:
        <select id="n-select" style="background:#333;color:#ddd;border:1px solid #555;border-radius:4px;padding:3px 6px">
            <option value="10" selected>10</option>
            <option value="50">50</option>
            <option value="100">100</option>

        </select>
    </label>
    <span id="status">Loading…</span>
    <span id="new-data-banner">&#x27F3; New predictions available — <a href="" onclick="location.reload();return false;">reload</a></span>
    <button id="save-btn" disabled>Save</button>
    <a class="settings-link" href="/metadata/visible/page" title="Configure visible metadata columns">⚙ Metadata columns</a>
    <a class="settings-link" href="/annotation_log" title="View annotation log and statistics">📊 Annotation Log</a>
    <div id="progress-bar" title="Dataset progress: labeled (light green), likely certain unlabeled (green), uncertain unlabeled (grey)">
        <div class="bar-segment bar-labeled"></div>
        <div class="bar-segment bar-certain"></div>
        <div class="bar-segment bar-uncertain"></div>
        <div id="progress-tooltip" style="display:none"></div>
    </div>
    <span id="al-acceleration" style="margin-left: 10px; font-size: 0.85em; color: #aaa;" title="Active Learning Acceleration = Likely Certain % / Labeled % (higher = more efficient)"></span>

<div id="table-wrap">
    <table id="main-table">
        <colgroup>
            <col class="col-img">
            <col class="col-uid">
            <col class="col-lbl">
            <col class="col-examples">
            <col style="width:180px">
        </colgroup>
        <thead>
        <tr>
            <th>Image</th>
            <th>UID</th>
            <th>Labels</th>
            <th>Examples</th>
            <th>Certainty</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script type="module">
    /* ── state ── */
    let allData = [];       // filtered to unlabeled only (for display)
    let fullData = [];      // complete dataset (for progress bar)
    let filteredData = [];  // display data (unlabeled only, search filtered)
    let filteredDataAll = []; // all data (labeled + unlabeled, search filtered, for progress bar)
    let labelDefs = [];
    let pending = {};       // uid -> label string (unsaved changes)
    let pendingCertainty = {}; // uid -> certainty value
    let reviewed = new Set(); // uids that have been approved or edited
    let activeLabel = null; // the label selected in the label bar
    let _pollTimer = null;  // setInterval handle for version polling
    let visibleMeta = [];   // ordered list of column names to show as metadata
    const examplesCache = new Map(); // label -> [uid, ...]
    let filterDebounceTimer = null; // debounce timer for filter input
    let isTyping = false;   // flag to prevent image loading while typing

    let childToParent = new Map(); // label -> parent label (or null)
    let parentToChildren = new Map(); // label -> [child labels]

    function normLabel(lbl) {
        return (lbl || '').toString().trim();
    }

    /* ── load visible metadata config ── */
    async function loadVisibleMeta() {
        const r = await $.getJSON('/metadata/visible');
        visibleMeta = r.selected || [];
    }

    /* ── load label defs ── */
    async function loadLabelDefs() {
        const j = await $.getJSON('/label_defs');
        labelDefs = (j.labels || []).map(l => normLabel(l[0]));
        childToParent = new Map();
        parentToChildren = new Map();
        (j.labels || []).forEach(([lbl, parent]) => {
            lbl = normLabel(lbl);
            parent = normLabel(parent);
            if (parent && parent !== 'null') {
                childToParent.set(lbl, parent);
                if (!parentToChildren.has(parent)) parentToChildren.set(parent, []);
                parentToChildren.get(parent).push(lbl);
            }
        });
    }

    /* ── build column list and filter params ── */
    function dataParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const filter_query = urlParams.get('filter_query');
        const baseColumns = [
            'uid', 'label_predicted', 'scores_predicted', 'labeled', 'set',
            'certainty', 'fre_strat', 'nn_underrepresented', 'calibrated_uncertainty',
            'partial_first', 'score_predicted',
        ];
        const allColumns = [...new Set([...baseColumns, ...visibleMeta])];
        const params = new URLSearchParams();
        params.set('columns', allColumns.join(','));
        if (filter_query) params.set('filter_query', filter_query);
        return params;
    }

    /* ── load parquet data (full) ── */
    async function loadData() {
        const params = dataParams();
        const file = await window.asyncBufferFromUrl({url: `/data?${params.toString()}`});
        return await window.parquetReadObjects({file});
    }

    /* ── load head parquet (fast initial render) ── */
    async function loadDataHead(n = 100) {
        const params = dataParams();
        params.set('n', n);
        const file = await window.asyncBufferFromUrl({url: `/data/head?${params.toString()}`});
        return await window.parquetReadObjects({file});
    }

    /* ── filter to active set (set == null / "active"), unlabeled only ── */
    function getActive(data) {
        const active = data.filter(d => d.set == null || d.set === '' || d.set === 'active');
        const pool = active.length > 0 ? active : data;
        // Treat 0 (unlabeled) and 0.5 (partial) as needing labeling in UI
        return pool.filter(d => !d.labeled || parseFloat(d.labeled) < 1);
    }

    /* ── sort by chosen column; NaN/missing last ── */
    function sortByFreStrat(data) {
        const col = $('#sort-select').val() || 'fre_strat';
        // Partial labeled first: sort by labeled value (0.5 comes before 0 and 1)
        if (col === 'partial_first') {
            return [...data].sort((a, b) => {
                const la = parseFloat(a.labeled) || 0;
                const lb = parseFloat(b.labeled) || 0;
                // Partial (0.5) should come first, then unlabeled (0), then labeled (1)
                // Map: 0.5 -> 0, 0 -> 1, 1 -> 2
                const pa = la === 0.5 ? 0 : (la === 0 ? 1 : 2);
                const pb = lb === 0.5 ? 0 : (lb === 0 ? 1 : 2);
                return pa - pb;
            });
        }
        // Default: ascending sort by column
        return [...data].sort((a, b) => {
            const fa = parseFloat(a[col]), fb = parseFloat(b[col]);
            const na = isNaN(fa), nb = isNaN(fb);
            if (na && nb) return 0; if (na) return 1; if (nb) return -1;
            return fa - fb;
        });
    }

    /* ── slice to the configured n ── */
    function sliceN(data) {
        const n = parseInt($('#n-select').val());
        return n > 0 ? data.slice(0, n) : data;
    }

    /* ── apply filter + n-limit ── */
    function applyFilter() {
        const q = $('#filter-input').val().toLowerCase().trim();
        // For display: unlabeled (0) and partial (0.5), but not fully labeled (1)
        const unlabeled = allData.filter(d => !d.labeled || parseFloat(d.labeled) < 1);
        const base = q
            ? unlabeled.filter(d => (d.label_predicted || '').toLowerCase().includes(q))
            : unlabeled;
        filteredData = sliceN(base);
        // For progress bar: all items (labeled + unlabeled) matching search
        const baseAll = q
            ? fullData.filter(d => (d.label_predicted || '').toLowerCase().includes(q))
            : fullData;
        filteredDataAll = baseAll;
        renderTable();
        updateProgressBar();
    }

    /* ── current label list for a row (array of non-empty strings) ── */
    function currentLabels(d) {
        let raw;
        if (pending[d.uid] !== undefined) {
            raw = pending[d.uid];
        } else {
            raw = d.label_predicted || '';
        }
        return raw ? raw.split(',').map(normLabel).filter(Boolean) : [];
    }

    /* ── serialize label list to string ── */
    function labelsToString(arr) {
        return arr.join(',');
    }

    /* ── rebuild the labels cell for one row ── */
    function refreshRow(d, $tr) {
        $tr.toggleClass('changed', pending[d.uid] !== undefined);
        const $cell = $tr.find('.labels-cell-inner').empty();
        const lbls = currentLabels(d);

        /* build label->score map from scores_predicted (only valid when labels unmodified) */
        const scoreMap = {};
        if (pending[d.uid] === undefined && d.scores_predicted && d.label_predicted) {
            const predLbls = d.label_predicted.toString().split(',');
            const predScores = d.scores_predicted.toString().split(',');
            predLbls.forEach((lbl, i) => {
                const s = parseFloat(predScores[i]);
                if (!isNaN(s)) scoreMap[lbl.trim()] = s;
            });
        }

        /* current label chips */
        const $chips = $('<div>').addClass('chips-row');
        if (lbls.length === 0) {
            $chips.append($('<span>').addClass('cur-label unlabeled').text('unlabeled'));
        } else {
            const sorted = [...lbls].sort((a, b) => ancestors(a).length - ancestors(b).length);
            $.each(sorted, (_, lbl) => {
                const $chip = $('<span>').addClass(`cur-label label_${lbl.replace(/ /g, '_')}`);
                const scoreStr = scoreMap[lbl] !== undefined ? ` ${Math.round(scoreMap[lbl] * 100)}%` : '';

                $('<span>').text(lbl + scoreStr + ' ✕').css('cursor','pointer').attr('title','Click to remove')
                    .on('click', (e) => { e.stopPropagation(); removeLabel(d, lbl, $tr); })
                    .appendTo($chip);

                /* + button to add a child label */
                $('<button>').addClass('add-child-btn').text('+').attr('title', `Add child of ${lbl}`)
                    .on('click', (e) => {
                        e.stopPropagation();
                        const $input = $('<input>').addClass('new-child-input')
                            .attr({type: 'text', placeholder: `child of ${lbl}…`})
                            .on('keydown', async function (ev) {
                                if (ev.key === 'Enter') {
                                    const name = $(this).val().trim();
                                    if (!name) return;
                                    /* register in label_defs */
                                    await $.ajax({url: '/label_defs', method: 'PUT',
                                        contentType: 'application/json',
                                        data: JSON.stringify([name, lbl])});
                                    /* update local maps */
                                    if (!labelDefs.includes(name)) {
                                        labelDefs.push(name);
                                        childToParent.set(name, lbl);
                                        if (!parentToChildren.has(lbl)) parentToChildren.set(lbl, []);
                                        parentToChildren.get(lbl).push(name);
                                    }
                                    $(this).remove();
                                    assignLabel(d, name, $tr);
                                } else if (ev.key === 'Escape') {
                                    $(this).remove();
                                }
                            });
                        $chip.after($input);
                        $input.trigger('focus');
                    })
                    .appendTo($chip);

                $chip.appendTo($chips);
            });
        }
        $cell.append($chips);

        /* per-row label search + picker */
        const $pickerWrap = $('<div>');
        const $search = $('<input>').addClass('label-search')
            .attr({type: 'text', placeholder: 'Search labels…'})
            .on('input', function () { renderPicker($(this).val().toLowerCase().trim()); });
        const $picker = $('<div>').addClass('label-picker');

        function renderPicker(q) {
            $picker.empty();
            let matches;
            if (q) {
                // Search mode: filter all labels
                matches = labelDefs.filter(l => l.toLowerCase().includes(q));
            } else {
                // Default mode: show descendants of all predicted labels,
                // with descendants of most specific labels shown first
                const currentLbls = currentLabels(d);
                
                // Sort labels by depth (deepest/most specific first)
                const sortedLabels = [...currentLbls]
                    .filter(l => !l.includes('=')) // skip undetermined
                    .sort((a, b) => ancestors(b).length - ancestors(a).length);
                
                // Collect descendants from each label in specificity order
                const descendantSet = new Set();
                const descendantOrder = [];
                
                sortedLabels.forEach((lbl, labelIdx) => {
                    const descs = descendants(lbl);
                    descs.forEach(desc => {
                        if (!descendantSet.has(desc)) {
                            descendantSet.add(desc);
                            // Priority = label specificity rank (0 = most specific)
                            const depth = ancestors(desc).length;
                            descendantOrder.push({label: desc, labelRank: labelIdx, depth});
                        }
                    });
                });
                
                // Sort: most specific parent's descendants first, then by depth, then alphabetically
                descendantOrder.sort((a, b) => {
                    if (a.labelRank !== b.labelRank) return a.labelRank - b.labelRank;
                    if (b.depth !== a.depth) return b.depth - a.depth;
                    return a.label.localeCompare(b.label);
                });
                
                // Build matches: descendants first (by specificity), then other labels
                const descendantLabels = descendantOrder.map(item => item.label);
                const otherLabels = labelDefs.filter(l => !descendantSet.has(l) && !currentLbls.includes(l));
                matches = [...descendantLabels, ...otherLabels];
            }
            
            matches.slice(0, 10).forEach(lbl => {
                $('<button>').addClass('pick-btn')
                    .toggleClass('selected', currentLabels(d).includes(lbl))
                    .text(lbl)
                    .on('click', (e) => { e.stopPropagation(); assignLabel(d, lbl, $tr); renderPicker($search.val().toLowerCase().trim()); })
                    .appendTo($picker);
            });
            if (matches.length > 10) {
                $picker.append($('<span>').css({fontSize:'0.75em', color:'#888'}).text(`…${matches.length - 10} more, refine search`));
            }
        }

        renderPicker('');
        $pickerWrap.append($search, $picker);
        $cell.append($pickerWrap);
    }

    /* ── walk ancestors of a label ── */
    function ancestors(lbl) {
        lbl = normLabel(lbl);
        const result = [];
        let cur = childToParent.get(lbl);
        while (cur) {
            result.push(cur);
            cur = childToParent.get(cur);
        }
        return result;
    }

    /* ── walk all descendants of a label (recursive) ── */
    function descendants(lbl) {
        lbl = normLabel(lbl);
        const children = parentToChildren.get(lbl);
        const result = [];
        const stack = children ? [...children] : [];
        while (stack.length) {
            const cur = stack.pop();
            result.push(cur);
            if (parentToChildren.has(cur)) stack.push(...parentToChildren.get(cur));
        }
        return result;
    }

    /* ── add a label (and its parents) to a row; remove hierarchical conflicts ── */
    function assignLabel(d, lbl, $tr) {
        const anc = ancestors(lbl);
        const ancSet = new Set([lbl, ...anc]);          // new label + all its ancestors
        const descSet = new Set(descendants(lbl));      // all descendants of new label

        const before = currentLabels(d);

        /* An existing label conflicts if it shares ANY ancestor (or is itself an
           ancestor/descendant) with the new label, but is NOT in the new label's
           own lineage. We drop it and re-add the new lineage cleanly. */
        const kept = before.filter(existing => {
            if (ancSet.has(existing)) return false;   // is ancestor of new label (will be re-added)
            if (descSet.has(existing)) return false;  // is descendant of new label (superseded)
            if (existing === lbl) return false;
            /* check if existing shares any ancestor with the new label → conflict */
            const existingAnc = new Set([existing, ...ancestors(existing)]);
            for (const a of ancSet) {
                if (existingAnc.has(a)) return false; // shares a node → conflicting branch
            }
            return true; // truly unrelated hierarchy
        });

        /* add lbl then its ancestors */
        const toAdd = [lbl, ...anc].filter(a => !kept.includes(a));
        const result = [...kept, ...toAdd];
        pending[d.uid] = labelsToString(result);
        reviewed.add(d.uid);
        refreshRow(d, $tr);
        updateSaveBtn();
    }

    /* ── approve a row as-is (stamp current labels into pending) ── */
    function approveRow(d, $tr) {
        if (pending[d.uid] === undefined) {
            pending[d.uid] = labelsToString(currentLabels(d));
        }
        if (pendingCertainty[d.uid] === undefined) {
            pendingCertainty[d.uid] = d.certainty || 'certain';
        }
        reviewed.add(d.uid);
        refreshRow(d, $tr);
        updateSaveBtn();
    }

    /* ── remove a label from a row ── */
    function removeLabel(d, lbl, $tr) {
        const removeSet = new Set([lbl, ...descendants(lbl)]);
        const lbls = currentLabels(d).filter(l => !removeSet.has(l) && !ancestors(l).includes(lbl));
        pending[d.uid] = labelsToString(lbls);
        reviewed.add(d.uid);
        refreshRow(d, $tr);
        updateSaveBtn();
    }

    /* ── render table ── */
    function renderTable() {
        const $tbody = $('#table-body').empty();
        const reviewedCount = filteredData.filter(d => reviewed.has(d.uid)).length;
        $('#status').text(`${reviewedCount} / ${filteredData.length} reviewed`);

        $.each(filteredData, (_, d) => {
            const $tr = $('<tr>').toggleClass('changed', pending[d.uid] !== undefined)
                .toggleClass('reviewed', reviewed.has(d.uid));

            /* image — click opens overlay (skip loading while typing) */
            const $imgCell = $('<td>').appendTo($tr);
            if (!isTyping) {
                $('<img>').addClass('thumb')
                    .attr({src: `/images/thumbnail/${d.uid}`, alt: d.uid})
                    .on('click', () => openOverlay(d))
                    .appendTo($imgCell);
            } else {
                $('<div>').addClass('thumb-placeholder')
                    .css({width: '60px', height: '60px', background: '#333', borderRadius: '4px', display: 'inline-block'})
                    .appendTo($imgCell);
            }

            /* uid */
            $('<td>').css({fontSize: '0.75em', color: '#999'}).text(d.uid).appendTo($tr);

            /* merged labels cell — click on cell assigns active label */
            const $labelsInner = $('<div>').addClass('labels-cell-inner');
            const $labelsCell = $('<td>')
                .css('cursor', 'pointer')
                .append($labelsInner)
                .on('click', function (e) {
                    if ($(e.target).hasClass('cur-label') && !$(e.target).hasClass('unlabeled')) return;
                    if (activeLabel) assignLabel(d, activeLabel, $tr);
                });
            $tr.append($labelsCell);

            /* metadata key-value pairs — appended inside the labels <td> below the inner div */
            if (visibleMeta.length > 0) {
                const $metaBlock = $('<div>').addClass('meta-block');
                visibleMeta.forEach(col => {
                    const val = d[col];
                    if (val === undefined || val === null || val === '') return;
                    $('<div>').addClass('meta-kv')
                        .append($('<span>').addClass('meta-key').text(col + ':'))
                        .append($('<span>').addClass('meta-val').text(val))
                        .appendTo($metaBlock);
                });
                $labelsCell.append($metaBlock);
            }

            /* examples cell */
            const $exCell = $('<td>').addClass('examples-cell');
            $tr.append($exCell);
            loadExamplesForRow(d, $exCell);

            /* certainty dropdown */
            const $certCell = $('<td>').css({verticalAlign: 'top', paddingTop: '8px'});
            const curCertainty = pendingCertainty[d.uid] || d.certainty || 'certain';
            const $certSelect = $('<select>')
                .css({background:'#333', color:'#ddd', border:'1px solid #555', borderRadius:'4px', padding:'3px 6px', fontSize:'0.85em'})
                .append($('<option>').val('certain').text('Certain'))
                .append($('<option>').val('i_dont_know_the_species').text("I don't know the species"))
                .append($('<option>').val('the_species_cannot_be_known').text('Species cannot be known'))
                .val(curCertainty)
                .on('change', function () {
                    pendingCertainty[d.uid] = $(this).val();
                    reviewed.add(d.uid);
                    $tr.toggleClass('changed', true);
                    updateSaveBtn();
                });
            $certCell.append($certSelect);
            $tr.append($certCell);

            /* approve button */
            const $approveCell = $('<td>').css({verticalAlign: 'top', paddingTop: '8px'});
            $('<button>').addClass('approve-btn')
                .text(reviewed.has(d.uid) ? '✓' : 'Approve')
                .toggleClass('approved', reviewed.has(d.uid))
                .on('click', () => approveRow(d, $tr))
                .appendTo($approveCell);
            $tr.append($approveCell);

            refreshRow(d, $tr);

            $tbody.append($tr);
        });
    }

    /* ── most specific label: deepest in hierarchy ── */
    function mostSpecificLabel(d) {
        const lbls = currentLabels(d).filter(l => !l.includes('='));  // skip undetermined
        if (!lbls.length) return null;
        return lbls.reduce((best, l) => ancestors(l).length > ancestors(best).length ? l : best, lbls[0]);
    }

    /* ── fetch + render example thumbnails for a row ── */
    async function loadExamplesForRow(d, $cell) {
        const lbls = currentLabels(d).filter(lbl => !lbl.includes('='));
        if (!lbls.length) { $cell.text('—'); return; }
        $cell.text('…');

        function appendStrip($container, label, uids) {
            $('<div>').addClass('examples-label').text(label).appendTo($container);
            const $strip = $('<div>').addClass('examples-strip').appendTo($container);
            if (!isTyping) {
                uids.forEach(uid => {
                    $('<img>').addClass('ex-thumb')
                        .attr({src: `/images/thumbnail/${uid}`, alt: uid, title: uid})
                        .on('click', () => openOverlay(uid))
                        .appendTo($strip);
                });
            } else {
                // Show placeholder squares while typing
                uids.forEach(() => {
                    $('<div>').addClass('ex-thumb-placeholder')
                        .css({width: '60px', height: '60px', background: '#333', borderRadius: '4px', display: 'inline-block', marginRight: '4px'})
                        .appendTo($strip);
                });
            }
        }

        /* try exact multi-label match first */
        const cacheKey = lbls.slice().sort().join(',');
        if (!examplesCache.has(cacheKey)) {
            const r = await $.getJSON(`/multilabel_examples?labels=${encodeURIComponent(cacheKey)}&n=10`);
            examplesCache.set(cacheKey, r.uids || []);
        }
        const exactUids = examplesCache.get(cacheKey);
        $cell.empty();
        if (exactUids.length) {
            appendStrip($cell, lbls.join(', '), exactUids);
            return;
        }

        /* fallback: per-label examples */
        const sorted = [...lbls].sort((a, b) => ancestors(b).length - ancestors(a).length);
        let any = false;
        for (const lbl of sorted) {
            if (!examplesCache.has(lbl)) {
                const r = await $.getJSON(`/class_examples/${encodeURIComponent(lbl)}?n=10`);
                examplesCache.set(lbl, r.uids || []);
            }
            const uids = examplesCache.get(lbl);
            if (!uids.length) continue;
            appendStrip($cell, lbl, uids);
            any = true;
        }
        if (!any) $cell.text('no examples').css('color','#666');
    }

    /* ── version polling ── */
    function startPollingForNewData() {
        if (_pollTimer) return; // already polling
        $.getJSON('/annflux_csv_version').done(r => {
            const versionAtSave = r.version;
            _pollTimer = setInterval(() => {
                $.getJSON('/annflux_csv_version').done(r2 => {
                    if (r2.version > versionAtSave) {
                        clearInterval(_pollTimer);
                        _pollTimer = null;
                        $('#new-data-banner').show();
                        $('#status').text('Predictions updated.');
                    }
                });
            }, 3000);
        });
    }

    /* ── save ── */
    function save() {
        const hasCertainty = Object.keys(pendingCertainty).length > 0;
        if (!Object.keys(pending).length && !hasCertainty) return;
        const savedUids = new Set([...Object.keys(pending), ...Object.keys(pendingCertainty)]);
        $('#save-btn').prop('disabled', true);
        const labelSave = Object.keys(pending).length
            ? $.post('/label?async=1', JSON.stringify(pending))
            : $.Deferred().resolve();
        const certSave = hasCertainty
            ? $.post('/certainty', JSON.stringify(pendingCertainty))
            : $.Deferred().resolve();
        $.when(labelSave, certSave)
            .done(() => {
                allData.forEach(d => { if (savedUids.has(d.uid)) d.labeled = 1; });
                fullData.forEach(d => { if (savedUids.has(d.uid)) d.labeled = 1; });
                pending = {};
                pendingCertainty = {};
                reviewed = new Set();
                applyFilter();
                updateSaveBtn();
                updateProgressBar();
                $('#status').text(`Saved ${savedUids.size} image(s). Background update running…`);
                startPollingForNewData();
            })
            .fail(() => {
                alert('Save failed. Please try again.');
                $('#save-btn').prop('disabled', false);
            });
    }

    function updateSaveBtn() {
        // Require explicit approval (in reviewed set) for all visible rows
        const allReviewed = filteredData.length > 0 && filteredData.every(d => reviewed.has(d.uid));
        $('#save-btn').prop('disabled', !allReviewed);
        const reviewedCount = filteredData.filter(d => reviewed.has(d.uid)).length;
        $('#status').text(`${reviewedCount} / ${filteredData.length} reviewed`);
    }

    /* ── update progress bar from current filtered view ── */
    function updateProgressBar() {
        // Compute percentages from filteredDataAll (includes both labeled and unlabeled, respects search query)
        const total = filteredDataAll.length;
        if (total === 0) {
            $('.bar-labeled').css('width', '0%');
            $('.bar-certain').css('width', '0%');
            $('.bar-uncertain').css('width', '0%');
            const tooltip = 'No items match current filter';
            $('#progress-bar').attr('title', tooltip);
            $('#progress-tooltip').text(tooltip);
            return;
        }
        const labeled = filteredDataAll.filter(d => d.labeled && parseFloat(d.labeled) >= 1).length;
        const unlabeled = total - labeled;
        // Use calibrated_uncertainty if available (uncertainty < 0.1 means >90% confident), fallback to score_predicted
        const certainUnlabeled = filteredDataAll.filter(d => {
            if (d.labeled && parseFloat(d.labeled) >= 1) return false;
            const calUnc = parseFloat(d.calibrated_uncertainty);
            if (!isNaN(calUnc)) {
                return calUnc < 0.1; // Low uncertainty = high confidence
            }
            // Fallback to raw score_predicted
            return parseFloat(d.score_predicted) > 0.90;
        }).length;
        const uncertainUnlabeled = unlabeled - certainUnlabeled;
        const pctLabeled = (labeled / total * 100).toFixed(1);
        const pctCertain = (certainUnlabeled / total * 100).toFixed(1);
        const pctUncertain = (uncertainUnlabeled / total * 100).toFixed(1);
        $('.bar-labeled').css('width', `${pctLabeled}%`);
        $('.bar-certain').css('width', `${pctCertain}%`);
        $('.bar-uncertain').css('width', `${pctUncertain}%`);
        const tooltip = `Labeled: ${pctLabeled}% (${labeled}) | Likely certain: ${pctCertain}% (${certainUnlabeled}) | Uncertain: ${pctUncertain}% (${uncertainUnlabeled}) — of ${total} filtered items`;
        $('#progress-bar').attr('title', tooltip);
        $('#progress-tooltip').text(tooltip);
        
        // AL Acceleration = ratio of likely certain to labeled (higher = more efficient)
        const alAccel = labeled > 0 ? (certainUnlabeled / labeled).toFixed(2) : '0.00';
        $('#al-acceleration').text(`AL Accel: ${alAccel}x`);
    }
    $('#progress-bar').on('mouseenter', () => $('#progress-tooltip').show());
    $('#progress-bar').on('mouseleave', () => $('#progress-tooltip').hide());

    /* ── overlay ── */
    function openOverlay(d) {
        const uid = typeof d === 'string' ? d : d.uid;
        const imageUrl = typeof d === 'object' && d.image_url ? d.image_url : null;
        const src = imageUrl || `/images/full/${uid}`;
        $('#overlay-img').attr('src', src);
        $('#overlay').addClass('open');
    }
    $('#overlay-close, #overlay').on('click', function (e) {
        if (e.target === this) $('#overlay').removeClass('open');
    });

    /* ── wire up toolbar ── */
    $('#filter-input').on('input', () => {
        isTyping = true;
        clearTimeout(filterDebounceTimer);
        filterDebounceTimer = setTimeout(() => {
            isTyping = false;
            applyFilter();
        }, 300); // 300ms debounce
    });
    $('#n-select').on('change', applyFilter);
    $('#sort-select').on('change', () => {
        allData = sortByFreStrat(allData);
        reviewed.clear();
        pending = {};
        pendingCertainty = {};
        applyFilter();
        updateSaveBtn();
    });
    $('#save-btn').on('click', save);

    /* ── init ── */
    await loadLabelDefs();
    await loadVisibleMeta();

    /* fast initial render from head - DISABLED */
    const headRaw = await loadDataHead(100);
    fullData = headRaw;
    allData = sortByFreStrat(getActive(headRaw));
    applyFilter();
    renderTable();
    updateSaveBtn();

    /* load full dataset directly */
    const raw = await loadData();
    fullData = raw;
    allData = sortByFreStrat(getActive(raw));
    applyFilter();
    renderTable();
    updateSaveBtn();
    updateProgressBar();
</script>
</body>
</html>
