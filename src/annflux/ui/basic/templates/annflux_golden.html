  function gridArrangeImages(elementId) {
    images = d3.select(elementId).selectAll("image");
    console.log("gridArrangeImages", images);
    const mapObject = gReferences.get(elementId);
    console.log("References", gReferences.get(elementId));
    let originalCoordinates = [];
    images.each((img) =>
      originalCoordinates.push([img[mapObject.xName], img[mapObject.yName]])
    );
    // console.log(originalCoordinates);
    console.log("originalCoordinates", originalCoordinates);
    // in the domain space solve the linear assignment problem
    const xDomainWidth = mapObject.xDomain[1] - mapObject.xDomain[0];
    const yDomainWidth = mapObject.yDomain[1] - mapObject.yDomain[0];

    const xRangeWidth = mapObject.x(mapObject.xDomain[1]) - mapObject.x(mapObject.xDomain[0]);
    const yRangeWidth = mapObject.y(mapObject.xDomain[1]) - mapObject.y(mapObject.xDomain[0]);

    const aspectRatio = xDomainWidth / yDomainWidth;

    const numX = Math.ceil(Math.sqrt(aspectRatio * originalCoordinates.length));
    const numY = Math.ceil(numX / aspectRatio);

    const thumbSizeX = xRangeWidth / numX;
    const thumbSizeY = yRangeWidth / numY;

    let gridCoordinates = [];
    for (let i = 0; i < originalCoordinates.length; i++) {
      let indexX = i % (numX + 1);
      let indexY = Math.floor(i / (numX + 1));

      gridCoordinates.push([
        mapObject.xDomain[0] + (indexX / (numX + 1)) * xDomainWidth,
        mapObject.yDomain[0] + (indexY / (numY + 1)) * xDomainWidth,
      ]);
    }
    console.log("gridCoordinates", gridCoordinates);

    function cost_(i, j) {
      return Math.sqrt(
        (originalCoordinates[i][0] - gridCoordinates[j][0]) ** 2 +
          (originalCoordinates[i][1] - gridCoordinates[j][1]) ** 2
      );
    }

    result = lap(originalCoordinates.length, cost_);
    console.log(result);
    images.each((img, i) => {
      const imgD3 = d3.select("#map-" + img.uid);
      // console.log(img);
      const gridCoordinate = gridCoordinates[result.row[i], result.col[i]];
      imgD3.attr("x", mapObject.x(gridCoordinate[0]));
      imgD3.attr("y", mapObject.y(gridCoordinate[1]));
      console.log("thumbSizeX", [thumbSizeX, thumbSizeY]);
      imgD3.attr("width", thumbSizeX);
      imgD3.attr("height", thumbSizeY);

      // console.log("aspect", imgD3.attr("width") / imgD3.attr("height"), imgD3.attr("width"), imgD3.attr("height"));
    });
  }

  function labelInGallery(uid, selectedLabel, multipleSelected, event) {
    let labelString = d3.select("#gallery-label-" + uid).attr("data");
    if (labelString == "n/a") {
      labelString = "";
    }
    if (event === undefined) {
      undetermined = false;
    } else {
      undetermined = event.ctrlKey;
    }
    const labels = labelString.split(",");
    console.log(labels);
    if (labels.includes(selectedLabel)) {
      if (!multipleSelected) {
        // remove label
        labelString = "";
        for (const label2 of labels) {
          if (label2 != selectedLabel && label2 != "n/a") {
            labelString += (labelString.length > 0 ? "," : "") + label2;
          }
        }
      }
      // TODO: remove child when parent is removed
    } else {
      let newLabels = [];
      for (const label2 of labels) {
        let removedLabel = null;
        if (exclusivity.has(selectedLabel)) {
          if (
            !(
              exclusivity.get(selectedLabel).indexOf(label2) > -1 ||
              exclusivity.get(selectedLabel) == "*"
            )
          ) {
            newLabels.push(label2);
          } else {
            removedLabel = label2;
          }
        } else if (exclusivity.has("*")) {
          if (exclusivity.get("*") != label2) {
            newLabels.push(label2);
          } else {
            removedLabel = label2;
          }
        } else {
          newLabels.push(label2);
        }
      }
      newLabels.push(!undetermined ? selectedLabel : selectedLabel + "=?");
      // add ancestors for child
      let childLabel = selectedLabel;
      while (childToParent.has(childLabel)) {
        let parentLabel = childToParent.get(childLabel);
        if (!labels.includes(parentLabel)) {
          newLabels.push(parentLabel);
        }
        childLabel = parentLabel;
      }
      //
      labelString = "";
      for (const label2 of newLabels) {
        labelString += (labelString.length > 0 ? "," : "") + label2;
      }
    }
    console.log("labelString", labelString);
    d3.select("#gallery-label-" + uid).attr("data", labelString);
    d2 = d3.select("#gallery-" + uid).data()[0];
    createQuickLabel(
      d2.uid,
      d2.labeled == 0 ? "quick_label_predicted" : "quick_label_true",
      labelString.length > 0 ? labelString.split(",") : [],
      true
    );
    //
    setLabeledGlobal();
    // console.log(gLabeled);
    // console.log("here", JSON.stringify(Object.fromEntries(gLabeled)));
    localStorage.setItem(
      "labeled",
      JSON.stringify(Object.fromEntries(gLabeled))
    );
    // $("#ui_log_last").html("Stored labeled in local storage");
    logUI("Stored labeled in local storage");
  }

  function shardFlux(force) {
    /*
    RELOAD=YES
    */
    if (urlParams.get("flux_mode") == "active_learning_shard") {
      const label_predicted_url = urlParams.get("label_predicted");
      if (
        label_predicted_url == null ||
        label_predicted_url === undefined ||
        force
      ) {
        const min_ = 100; //TODO
        let shards = new Array();
        d3.csv("/detailed_performance/data", function (data_) {
          console.log("detailed_performance", data_);
          let total = 0;
          for (row of data_) {
            row.num_predicted =
              parseInt(row.num_predicted_certain) +
              parseInt(row.num_predicted_uncertain);
            total += row.num_predicted;
          }
          const max_ = 0.1 * total;
          for (row of data_) {
            console.log(min_, row.num_predicted, max_);
            if ((row.num_predicted >= min_) & (row.num_predicted <= max_)) {
              shards.push(row);
            }
          }
          // random sample, TODO proper
          shards = _.shuffle(shards);
          for (const row of shards) {
            if (parseFloat(row.precision) < Math.random()) {
              // alert(row.label);
              $("#label_predicted").val(row.label.toLowerCase());
              changeOption(document.getElementById("label_predicted"));
              break;
            }
          }

          console.log("total", total, "shards", shards);
        });
      }
    }
  }
