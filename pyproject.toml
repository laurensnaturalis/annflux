[project]
name = "annflux"
authors = [
    { name = "Laurens Hogeweg", email = "laurens.hogeweg@intel.com" },
]
version = "1.3.2.0"
description = "This standalone tool provides a basic interface for interacting with large datasets so that they can be explored and annotated efficiently."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "duckdb>=1.4.3",
    "faiss-cpu~=1.10.0",
    "ffmpeg-python>=0.2.0",
    "filetype>=1.2.0",
    "flask~=3.1.0",
    "flask-caching~=2.3.1",
    "flask-cors~=5.0.1",
    "flask-httpauth~=4.8.0",
    "flask-limiter~=3.12",
    "line-profiler>=5.0.0",
    "matplotlib~=3.10.1",
    "numpy~=1.26.4",
    "open-clip-torch>=3.2.0",
    "opencv-python~=4.11.0.86",
    "pandas~=2.2.3",
    "peft>=0.18.0",
    "pillow~=11.1.0",
    "pyarrow~=20.0.0",
    "pytest~=8.3.5",
    "pytest-cov>=7.0.0",
    "python-dateutil~=2.9.0.post0",
    "pytz~=2025.2",
    "requests~=2.32.3",
    "ruff>=0.14.9",
    "scikit-image~=0.25.2",
    "scikit-learn~=1.6.1",
    "scipy~=1.15.2",
    "taxonlib>=0.0.7",
    "tifffile~=2025.3.13",
    "torch>=2.5.1,<2.8",
    "torchvision>=0.20.0,<0.23",
    "tqdm~=4.67.1",
    "transformers>=4.57.3",
    "ty>=0.0.2",
    "umap-learn~=0.5.7",
    "urllib3~=2.3.0",
    "werkzeug~=3.1.3",
    "zarr~=3.0.7",
]

[project.optional-dependencies]
projects = [
    "bioscan-dataset>=1.3.0",
]

[project.scripts]
annflux = "annflux.scripts.annflux_cli:execute"
basic_ui = "annflux.ui.basic.run_server:ui_script_entry"
run_tests = "annflux.scripts.run_tests:_run_tests"

#[tool.setuptools.dynamic]
#dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
annflux = ["ui/basic/static/*", "ui/basic/templates/*", "data/**/*.json", "ui/basic/static/**/*"]

[tool.ruff]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["build", "dist"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/annflux/projects", "src/annflux/data"]
